<!--
  Background motif: cowrie shells.

  Cowries were currency across West Africa for centuries, including the Gold
  Coast, and remain a cultural shorthand for money and saving. Using them here
  places a digital savings ledger in the tradition it actually belongs to,
  rather than borrowing the visual language of a bank.

  Constraints this design answers:
    * NFR-01 — an SVG tile is about 1 KB and one cacheable request. A raster
      background would have added weight to a page whose performance budget is
      already exceeded (TD-02).
    * NFR-08 — drawn at very low opacity and tiled behind content cards, never
      beneath body text, so contrast is unaffected and the interface stays
      legible in direct sunlight.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="190" height="190"
     viewBox="0 0 190 190">
  <defs>
    <!-- One shell: an almond body with the toothed aperture cowries are known by. -->
    <g id="cowrie" stroke="#1f4e5f" fill="none" stroke-width="1.4"
       stroke-linecap="round">
      <path d="M12 1.5 C17 1.5 20.8 7.2 20.8 16 C20.8 24.8 17 30.5 12 30.5
               C7 30.5 3.2 24.8 3.2 16 C3.2 7.2 7 1.5 12 1.5 Z"/>
      <path d="M12 6.5 C13.1 6.5 13.7 9.4 13.7 16 C13.7 22.6 13.1 25.5 12 25.5
               C10.9 25.5 10.3 22.6 10.3 16 C10.3 9.4 10.9 6.5 12 6.5 Z"
            stroke-width="1.1"/>
      <g stroke-width=".9">
        <path d="M9.5 10.5h1.3M9.3 14h1.4M9.3 17.5h1.4M9.5 21h1.3"/>
        <path d="M13.2 10.5h1.3M13.3 14h1.4M13.3 17.5h1.4M13.2 21h1.3"/>
      </g>
    </g>
  </defs>

  <!-- Scattered rather than gridded, so the tile repeat is not obvious. -->
  <g opacity=".05">
    <use href="#cowrie" transform="translate(18 14) rotate(-18 12 16)"/>
    <use href="#cowrie" transform="translate(122 42) rotate(37 12 16)"/>
    <use href="#cowrie" transform="translate(62 104) rotate(-6 12 16)"/>
    <use href="#cowrie" transform="translate(150 136) rotate(-48 12 16)"/>
  </g>
</svg>
