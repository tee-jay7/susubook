<!--
  SusuBook mark.

  A susu card, part-filled: the outline is the card, the grid is its days, and
  the fading rows are days not yet paid. It is the same image the client sees on
  their own card, reduced to nine squares.

  Drawn in currentColor so one file serves the teal header and the white page
  without a second variant.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"
     role="img" aria-label="SusuBook">
  <rect x="2.6" y="2.6" width="26.8" height="26.8" rx="6.5"
        stroke="currentColor" stroke-width="2.2"/>
  <g fill="currentColor">
    <rect x="7.0" y="7.0" width="5.2" height="5.2" rx="1.35"/>
    <rect x="13.4" y="7.0" width="5.2" height="5.2" rx="1.35"/>
    <rect x="19.8" y="7.0" width="5.2" height="5.2" rx="1.35"/>
    <rect x="7.0" y="13.4" width="5.2" height="5.2" rx="1.35"/>
    <rect x="13.4" y="13.4" width="5.2" height="5.2" rx="1.35"/>
    <rect x="19.8" y="13.4" width="5.2" height="5.2" rx="1.35" opacity=".35"/>
    <rect x="7.0" y="19.8" width="5.2" height="5.2" rx="1.35" opacity=".35"/>
    <rect x="13.4" y="19.8" width="5.2" height="5.2" rx="1.35" opacity=".35"/>
    <rect x="19.8" y="19.8" width="5.2" height="5.2" rx="1.35" opacity=".35"/>
  </g>
</svg>
